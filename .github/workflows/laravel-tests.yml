name: Laravel CI

# Déclencheurs : le robot travaille à chaque push ou pull request sur main
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest # On utilise un serveur Linux (Ubuntu)

    # Étape 1 : Créer une base de données MySQL temporaire pour les tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    # Étape 2 : Récupérer ton code depuis le dépôt GitHub
    - uses: actions/checkout@v4

    # Étape 3 : Installer PHP et les extensions nécessaires
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, dom, curl, libxml, mysql
        coverage: none

    # Étape 4 : Installer les dépendances (Composer)
    - name: Install Dependencies
      run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    # Étape 5 : Préparer l'environnement Laravel
    - name: Prepare Environment
      run: |
        cp .env.example .env
        php artisan key:generate

    # Étape 6 : Lancer les migrations et les tests
    # On définit ici les accès à la base MySQL créée à l'étape 1
    - name: Run Tests
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: testing
        DB_USERNAME: root
        DB_PASSWORD: ""
      run: php artisan test